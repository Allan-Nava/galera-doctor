name: Release

# A tag builds it all, through goreleaser — the same shape as the sibling
# tools, so one person can read both. The notes are the exception: they come
# from CHANGELOG.md via scripts/release.sh, because a changelog written for
# people beats a list of commit subjects.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.9.1)"
        required: true

permissions:
  contents: read

# Serialize releases: goreleaser pushes the mutable latest-amd64 / latest-arm64
# tags on every release, and two runs at once clobber each other's, after which
# the :latest manifest cannot verify its digest. Queue them; never cancel, since
# every tag has to release fully.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release, and the archives on it
      packages: write # the image on ghcr.io
      id-token: write # keyless cosign signing through GitHub OIDC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser wants the history
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: The tag being released
        id: v
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >>"$GITHUB_OUTPUT"

      # A release of code that does not pass its own tests is worse than no
      # release: the tag is permanent.
      - run: go test -race ./...

      # Written up before it is published, or the release page says nothing.
      - name: Release notes, lifted from CHANGELOG.md
        run: ./scripts/release.sh notes "${{ steps.v.outputs.tag }}" >notes.md

      # Without this the cask step fails inside goreleaser with a template
      # error about an empty environment variable, which reads like a
      # goreleaser bug rather than a missing secret.
      - name: The tap token has to be here
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_GITHUB_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_GITHUB_TOKEN is not set, so the Homebrew cask cannot be pushed to Allan-Nava/homebrew-tap."
            echo "::error::Add a PAT with repo scope: gh secret set HOMEBREW_TAP_GITHUB_TOKEN --repo ${{ github.repository }}"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=notes.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # A PAT with repo scope: pushing the cask writes to another
          # repository, which the job's own token cannot do.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
